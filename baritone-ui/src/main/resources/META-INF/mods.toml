modLoader="kotlinforforge"
loaderVersion="${kff_loader_version_range}"
license="MIT"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
# Client-only mod: the server must not require it, and must not try to load
# the client-only classes it references (net.minecraft.client.*).
displayTest="IGNORE_SERVER_VERSION"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Kotlin for Forge -- required language provider
[[dependencies.${mod_id}]]
    modId="kotlinforforge"
    mandatory=true
    versionRange="${kff_loader_version_range}"
    ordering="NONE"
    side="BOTH"
# Baritone -- REQUIRED. The panel and HUD drive Baritone through its API; without
# it the mod cannot function, so let Forge reject the load up front instead of
# letting the player reach a half-broken UI. Loading order is AFTER so Baritone
# has registered its provider by the time the bridge resolves it. Side is CLIENT
# because both mods run on the client only -- a dedicated server never needs
# either of them.
[[dependencies.${mod_id}]]
    modId="baritone"
    mandatory=true
    versionRange="${baritone_version_range}"
    ordering="AFTER"
    side="CLIENT"
