modLoader="kotlinforforge"
loaderVersion="${kff_loader_version_range}"
license="MIT"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
# Client-only mod: the server must not require it, and must not try to load
# the client-only classes it references (net.minecraft.client.*).
displayTest="IGNORE_SERVER_VERSION"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="kotlinforforge"
    mandatory=true
    versionRange="${kff_loader_version_range}"
    ordering="NONE"
    side="BOTH"
